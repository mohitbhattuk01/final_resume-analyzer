<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Resume Screening 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }

        body {
            background: #0b0d17;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(0,210,255,0.07) 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(255,100,200,0.06) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes bgFloat {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            50% { transform: translate(-2%,2%) rotate(3deg); }
        }

        .header {
            background: rgba(11,13,23,0.85);
            backdrop-filter: blur(20px);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(120,80,255,0.3);
            position: relative; z-index: 2;
        }

        .logo h1 {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(135deg, #7c5cff, #00d4ff, #ff6ec7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav a {
            color: #94a3b8; text-decoration: none;
            margin-left: 20px;
            padding: 8px 18px; border-radius: 10px;
            font-size: 14px; font-weight: 500;
            transition: all 0.3s;
        }
        .nav a:hover { background: rgba(124,92,255,0.15); color: #c4b5fd; }

        .login-container {
            flex: 1; display: flex;
            justify-content: center; align-items: center;
            padding: 20px; position: relative; z-index: 1;
        }

        .login-box {
            background: rgba(20,22,40,0.7);
            backdrop-filter: blur(24px);
            padding: 48px;
            border-radius: 24px;
            width: 100%; max-width: 460px;
            border: 1px solid rgba(124,92,255,0.2);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }

        .login-box h2 {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, #c4b5fd, #7c5cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px; text-align: center;
        }

        .login-box .subtitle {
            color: #64748b; text-align: center;
            margin-bottom: 32px; font-size: 14px;
        }

        .form-group { margin-bottom: 22px; }

        label {
            display: block; color: #94a3b8;
            margin-bottom: 8px; font-size: 13px;
            font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input {
            width: 100%; padding: 14px 18px;
            background: rgba(30,33,58,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; color: white;
            font-size: 15px; transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #7c5cff;
            box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
        }

        .login-btn {
            background: linear-gradient(135deg, #7c5cff, #6d28d9);
            color: white; border: none;
            padding: 15px 36px; border-radius: 12px;
            font-size: 16px; font-weight: 700;
            cursor: pointer; width: 100%;
            transition: all 0.3s; margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(124,92,255,0.4);
        }



        .message {
            margin-top: 18px; padding: 14px;
            border-radius: 10px; display: none;
            font-size: 14px; font-weight: 500;
        }

        .success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }
        .error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }

        .footer {
            background: rgba(11,13,23,0.9);
            text-align: center; padding: 18px;
            color: #475569; font-size: 13px;
            border-top: 1px solid rgba(255,255,255,0.04);
            position: relative; z-index: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><h1>🔐 ADMIN PANEL</h1></div>
        <div class="nav">
            <a href="/">🏠 Home</a>
            <a href="/apply">📄 Apply</a>
            <a href="/admin">🔐 Admin</a>
        </div>
    </div>

    <div class="login-container">
        <div class="login-box">
            <h2>Admin Login</h2>
            <p class="subtitle">Enter credentials to access the dashboard</p>

            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>

            <div class="form-group">
                <label>🔑 Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>

            <button class="login-btn" onclick="login()">
                🚀 Login to Dashboard
            </button>


            <div id="messageBox" class="message"></div>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 AI Resume Screening System — Admin Access Only</p>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageBox = document.getElementById('messageBox');

            messageBox.style.display = 'block';
            messageBox.className = 'message';
            messageBox.innerHTML = '⏳ Verifying credentials...';
            messageBox.style.color = '#94a3b8';

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    messageBox.className = 'message success';
                    messageBox.innerHTML = '✅ ' + (data.message || 'Login successful!') + ' Redirecting...';
                    setTimeout(() => { window.location.href = '/admin/dashboard'; }, 1200);
                } else {
                    messageBox.className = 'message error';
                    messageBox.innerHTML = '❌ ' + (data.message || 'Invalid credentials');
                }
            } catch (error) {
                messageBox.className = 'message error';
                messageBox.innerHTML = '❌ Login failed. Please try again.';
            }
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
