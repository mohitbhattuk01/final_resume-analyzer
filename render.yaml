services:
  - type: web
    name: resume-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd resume_portal && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONIOENCODING
        value: utf-8
